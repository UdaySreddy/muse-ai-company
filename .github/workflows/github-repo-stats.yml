# Long-term traffic archive — working around the GitHub Traffic API keeping only a 14-day window.
#
# Every day, remotely fetch views/clones/referrers/stars/forks of the public repo CronusL-1141/AI-company,
# and accumulate them into the github-repo-stats data branch of this private repo (including HTML reports);
# traffic data never lands in the public repo and is not exposed externally.
#
# Depends on the secret GHRS_GITHUB_API_TOKEN: a classic PAT with the repo scope checked
# (the traffic API requires push permission on the target repo; it is also used to write back to the data branch).
name: github-repo-stats

on:
  schedule:
    # Every day at UTC 23:47 (Beijing 07:47), avoiding the on-the-hour load peak
    - cron: "47 23 * * *"
  workflow_dispatch: {}

jobs:
  ghrs:
    name: github-repo-stats
    # Run only in the private repo — the public repo has no secret, so running there would only produce failure records
    if: github.repository == 'CronusL-1141/AI-company-private'
    runs-on: ubuntu-latest
    steps:
      - name: run-ghrs
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          repository: CronusL-1141/AI-company
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
