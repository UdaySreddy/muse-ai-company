name: AI Team OS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  invariants:
    # Red-line invariants: hook dual copies / version lockstep / dual dist consistency / venv ban (docs/knowledge-layer-design.md P0)
    # I9-I14 (since v1.11.1) need to import the application itself (fastmcp/sqlalchemy/pydantic),
    # a bare checkout would false-red with ModuleNotFoundError — the dependency list shares its source with the test job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy aiosqlite greenlet pydantic pydantic-settings pyyaml anyio typer rich alembic
          pip install "fastmcp>=3.4.5,<4"

      - name: Check invariants
        run: bash scripts/check_invariants.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install fastapi uvicorn sqlalchemy aiosqlite greenlet pydantic pydantic-settings pyyaml anyio typer rich alembic
          pip install fastmcp || true
          pip install langgraph langchain-anthropic langchain-core || true

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: TypeScript compile check
        working-directory: dashboard
        run: npx tsc -b --noEmit
